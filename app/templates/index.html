<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Editor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow p-4" style="width: 500px;">

            <h1 class="text-center mb-4">
                Resume Editor
            </h1>


            <!-- LOGIN SECTION -->
            <div id="loginSection">

                <h3 class="mb-3">Login</h3>

                <form id="loginForm">

                    <div class="mb-3">
                        <label class="form-label">Email</label>

                        <input type="email" id="loginEmail" class="form-control" required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Password</label>

                        <input type="password" id="loginPassword" class="form-control" required>
                    </div>


                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>

                </form>


                <button type="button" id="showSignup" class="btn btn-outline-success w-100 mt-3">
                    Create Account
                </button>

            </div>



            <!-- SIGNUP SECTION -->
            <div id="signupSection" style="display: none;">

                <h3 class="mb-3">Create Account</h3>

                <form id="signupForm">

                    <div class="mb-3">

                        <label class="form-label">Email</label>

                        <input type="email" id="signupEmail" class="form-control" required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">Password</label>

                        <input type="password" id="signupPassword" class="form-control" required>

                    </div>


                    <button type="submit" class="btn btn-success w-100">
                        Sign Up
                    </button>

                </form>


                <button type="button" id="showLogin" class="btn btn-outline-secondary w-100 mt-3">
                    Back to Login
                </button>

            </div>



            <!-- OTP SECTION -->
            <div id="otpSection" style="display: none;">

                <h3 class="mb-3">Verify Your Email</h3>

                <p class="text-muted">
                    Enter the OTP sent to your email.
                </p>


                <form id="otpForm">

                    <div class="mb-3">

                        <label class="form-label">
                            Enter OTP
                        </label>

                        <input type="text" id="otpInput" class="form-control" placeholder="Enter 6 digit OTP" required>

                    </div>


                    <button type="submit" class="btn btn-warning w-100">
                        Verify OTP
                    </button>

                </form>

            </div>


        </div>

    </div>


    <script src="/static/js/auth.js"></script>

</body>

</html>
