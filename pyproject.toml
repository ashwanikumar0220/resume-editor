[project]
name = "resume-editor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "resend[async]>=2.39.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
resume-editor = "resume_editor:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
